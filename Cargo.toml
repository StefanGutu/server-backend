[package]
name = "server-echopass"
version = "0.1.0"
edition = "2024"

[features]
# Login with a phone number and a code (POST /auth/otp/start, provider "phone"). Off: there is no SMS
# provider, so the code could only be read in the log. Turn on with: cargo run --features phone-login
phone-login = []

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
pdf-writer = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "v5", "v7", "serde"] }
